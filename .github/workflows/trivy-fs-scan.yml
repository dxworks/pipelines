name: Trivy Filesystem Scan

on:
  workflow_call:
    inputs:
      severity:
        description: Severity levels to report
        type: string
        default: MEDIUM,HIGH,CRITICAL
      fail-severity:
        description: Severity levels that cause the workflow to fail (defaults to all severities, i.e. fail on any finding). Reporting is controlled separately by `severity`.
        type: string
        default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      fail-on-findings:
        description: Fail the workflow if vulnerabilities are found (at the levels in `fail-severity`)
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  trivy-fs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy filesystem scanner (table)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          severity: ${{ inputs.severity }}

      # Report-only: trivy-action always builds the SARIF over all severities,
      # so this step never gates (the dedicated "Fail on configured severities"
      # step below owns the pass/fail decision). This keeps the full set of
      # findings visible in the Security tab regardless of fail-severity.
      - name: Run Trivy filesystem scanner (sarif)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: 0
          severity: ${{ inputs.severity }}

      - name: Upload filesystem scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      # Gate: fails only on the severities in `fail-severity` (default: all).
      # Runs after reporting/upload so findings are always recorded first.
      - name: Fail on configured severities
        if: always() && inputs.fail-on-findings
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: ${{ inputs.fail-severity }}
